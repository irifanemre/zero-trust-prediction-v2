notlar: |
  v8. UEBA-0003 (genel veri çıkış hacmi) ile AYNI kalıp ve AYNI eşik, farklı kanal.

  Gerekçe: e-posta baytları şimdiye kadar genel `bytes_out` havuzuna karışıyordu ve web trafiğiyle
  AYNI baz çizgisini paylaşıyordu. Yoğun web kullanan bir kullanıcının dış e-postayla veri çıkarması
  kendi web tabanına gömülüyordu — v6-D'de bulut kanalında ölçülen maskelemenin birebir aynısı.

  Eşik 3,5 ve ölçek 2,0 UEBA-0003'ten alındı: aynı türde sinyal (hacim robust-z'si), aynı istatistik,
  dolayısıyla farklı bir eşik seçmek için sebep yok. Ağırlık 6 — UEBA-0003'ün 8'inden düşük (tek kanal
  ölçüyor), UEBA-0021'in 4'ünden yüksek (hacim, niyetten daha doğrudan kanıt).

  İÇ e-posta kapsam dışıdır: `email_internal` kurumun kendi alan adına gider ve sızıntı kanalı değildir.
  Ayrım `data/cert.py` içinde alıcı adresine bakılarak yapılır.

  GÖLGE MODDA doğdu (13.6). Yayına çıkış şartı ön kayıtta yazılı üç eşiktir.
