notlar: '1.1: akran oranı VE koşulundan çıkarıldı, şiddet ölçekleyicisine dönüştürüldü (UEBA-0005 deseni).
  Gerekçe: akran medyanı yüksek olan veri yoğun departmanlarda (finans) oran tavanı, kişisel olarak
  uç bir sapmayı veto ediyordu — ele geçirilmiş hesap akran medyanının 5 katının altında kalarak
  görünmez oluyordu. Akranla aynı davranan kullanıcı artık elenmez, şiddeti düşer ve sıralamada
  geriye gider (13.5). Ayrıca 2.3 "eşik altı kalma" için 7 günlük kümülatif pencere eklendi
  (veri_hacmi_anomali_z = max(günlük z, 7g z)). Kritik varlığa erişim varsa akran indirimi uygulanmaz.'
