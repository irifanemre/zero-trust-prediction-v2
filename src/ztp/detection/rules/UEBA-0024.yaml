notlar: |
  v8. UEBA-0022 (sızıntı kanalı) ile AYNI kalıp ve AYNI sabitler, farklı kanal.

  Gerekçe: `webmail` kategorisi URL_CATEGORIES içinde tanımlıydı (gmail, yahoo, hotmail, outlook) ama
  ne SENSITIVE_APPS ne CLOUD_APPS kümesindeydi — yani kişisel webmail TANINIYOR ve GÖRMEZDEN GELİNİYORDU.
  Kurumsal e-posta ağ geçidinin denetlediği bir ortamda kişisel webmail, denetimi atlamanın en basit
  yoludur ve USB kapatıldığında birincil kanallardan biri hâline gelir.

  Eşikler (>= 3, p < 0,02) UEBA-0022'den alındı: webmail de seyrek bir sızıntı kanalıdır ve v6-D'de
  ölçülen asimetri (seyrek sayaçta p<0,001 yapısal olarak sert — 15 kat sıçrama ister) burada da
  geçerlidir. Taban zemini 0,02 aynı gerekçeyle.

  Kapsam: yalnız kişisel webmail SİTELERİNE erişim. Kurumsal e-posta gönderimi UEBA-0023'ün konusudur;
  ikisi farklı kanaldır ve ayrı sayılır.

  GÖLGE MODDA doğdu (13.6).
