# Müşteri (tenant) yapılandırması örneği — komut satırı değerleri bu dosyayı ezer.
# Sayısal değerler KALİBRASYON BAŞLANGIÇ DEĞERLERİDİR; gölge mod ölçümleriyle doğrulanmadan taahhüde dönüşmez.
tenant_id: musteri-A

# Alarm bütçesi: günlük inceleme kuyruğu = analist kapasitesi (sabit eşik yok)
alarm_budget_per_day: 8
critical_percentile: 0.999

# Baseline pencereleri ve zehirleme şüphesi eşiği (7g vs 90g medyan farkı, robust-z)
short_window_days: 7
long_window_days: 90
poisoning_drift_z: 2.5

# Akran grubu
min_peer_group: 8
behavioral_peer_min_days: 30

# Veri kalitesi eşikleri
dq_min_volume_ratio: 0.3
dq_max_late_ratio: 0.2
dq_max_unresolved_ratio: 0.2

# Gölge mod yayına giriş kriteri
shadow_min_days: 14
shadow_min_precision: 0.25
shadow_max_daily_alerts: 2.0

# Füzyon (zamansal + yapısal)
fusion_temporal_weight: 0.7
fusion_structural_weight: 0.3

# Raporlama: none | ollama | anthropic
llm_backend: none
ollama_model: gemma3:12b
ollama_url: http://localhost:11434
rag_enabled: true               # ATT&CK bilgi tabanı bağlamı (bütünlük doğrulamalı)
llm_on_injection: template      # kanıt metninde talimat benzeri içerik → LLM çağrılmaz, şablon + güvenlik bayrağı
llm_max_field_len: 200

# Bu müşteride mevcut log kaynakları (eksik kaynağa bağlı kurallar otomatik devre dışı kalır)
available_sources: [ad, hr, proxy, edr, vpn, file_server, dlp]

# Derin graf analizinin hedef aldığı kritik varlıklar
critical_assets:
  - '\\FIN-SRV-01\butce'
  - '\\HR-SRV-01\bordro'

# Aldatma katmanı: tuzak varlıklar (meşru kullanımı yok → her etkileşim deterministik KRİTİK tespit, bütçeden bağımsız)
honeytokens:
  hesaplar: [svc-backup-legacy, adm-eski]        # tuzak AD/servis/ayrıcalıklı hesap; kullanım kaynağına (cihaz sahibi → IP) atfedilir
  kaynaklar: ['\\FIN-SRV-01\bonus_2026*']        # tuzak dosya/paylaşım (fnmatch kalıbı)
  cihazlar: [HONEY-SRV-01]                       # tuzak sunucu
  gizli_dizgiler:                                # sahte API anahtarı / SSH key / cloud secret / DB parolası
    - AKIA-FAKE-9Z1QWERTYUIOP                    # komut satırı, dosya yolu, süreç adı ve uygulama alanında aranır
    - ssh-rsa-TUZAK-KEY-2026                     # içerme araması: "Bearer <anahtar>" gibi kullanımlar da yakalanır

# Bastırma kuralları: en dar kapsam, son kullanma tarihi, yazılı gerekçe ve sahip zorunlu
suppressions:
  - rule_id: UEBA-0003
    sid: U-1028
    start: "2026-09-01"
    end: "2026-11-30"
    reason: "aylık kapanış toplu raporlama"
    owner: "finans-it"

# 17.6 Vaka çıkışı (SOAR / ticketing); gerçek kimlik gönderilmez, webhook gövdesi HMAC-SHA256 ile imzalanır
sinks:
  - type: jsonl
  # - type: webhook
  #   url: https://soar.example/api/ztp
  #   secret_env: ZTP_WEBHOOK_SECRET
  #   headers: {Authorization: "Bearer ..."}
  #   timeout: 10
  #   retries: 3

# Kalıcı durum (günlük servis modu): müşteri dizinindeki SQLite dosyası
state_file: state.sqlite

# 19.5 ablasyon anahtarları (üretimde true); 14.6 öğrenen modelin skora eklenme ağırlığı (0 = kapalı)
correlation_multipliers: true
peer_context: true
prediction_weight: 0.0

# Üretimde KMS/vault'tan gelir
pseudonym_secret: degistir-bu-anahtari
