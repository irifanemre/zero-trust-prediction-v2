[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-trust-prediction"
version = "0.1.0"
description = "Proaktif kullanıcı/varlık risk öngörüsü: UEBA + Zero Trust Prediction + Knowledge Graph (MSSP/MSOC mimari doğrulama uygulaması)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "irifanemre" }]
keywords = ["ueba", "insider-threat", "zero-trust", "security-analytics", "detection-as-code", "mitre-attack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.1",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
ml = ["torch>=2.2"]  # v6-B Transformer kolu / v6-C öğrenen graf; çekirdek bunlarsız çalışır
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]
docs = ["weasyprint>=60", "markdown>=3.5", "pymdown-extensions>=10"]  # scripts/build_pdf.py (pango gerekir)

[project.scripts]
ztp = "ztp.cli:main"

[project.urls]
Repository = "https://github.com/irifanemre/zero-trust-prediction"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ztp.detection" = ["rules/*.yaml", "runbooks/*.md"]
"ztp.reporting" = ["knowledge/*.yaml", "knowledge/MANIFEST.sha256"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "N802", "N803", "N806", "N815", "N816", "B905", "SIM108", "SIM102", "SIM117", "UP007", "UP006", "UP035", "UP045", "B023", "B006", "B007", "B008", "B904", "SIM103", "SIM110", "SIM115", "SIM118", "UP037", "SIM401", "SIM105", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["ztp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: uzun süren uçtan uca testler (varsayılan olarak çalışır; -m 'not slow' ile atlanır)"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
